<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Italia Widget Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 32px;
    }

    h1 {
      color: #D4A843;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls label { color: #888; font-size: 13px; }

    .controls input[type="date"] {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .controls button {
      background: #D4A843;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .controls button:hover { background: #e8bc58; }

    /* ── Widget shell (iPhone large widget proportions) ── */
    .widget {
      width: 338px;
      height: 354px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    /* ── Countdown ── */
    .countdown {
      background: linear-gradient(160deg, #2D1B0E 0%, #1A1A2A 50%, #0D1F0D 100%);
      padding: 18px 20px 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .countdown .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .countdown .header .flag-label {
      color: #D4A843;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .countdown .chip {
      display: inline-block;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
    }
    .countdown .illustration {
      margin-top: 14px;
      width: 100%;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff18;
      border-radius: 14px;
      font-size: 80px;
      flex-shrink: 0;
    }
    .countdown .illustration img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }
    .countdown .big-number {
      font-size: 86px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      letter-spacing: -3px;
      margin-top: 14px;
    }
    .countdown .days-label {
      color: #ffffff99;
      font-size: 15px;
      font-weight: 500;
      margin-top: 2px;
    }
    .countdown .fact {
      color: #F5F0E8;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 10px;
      flex: 1;
    }
    .countdown .date-label {
      color: #ffffff55;
      font-size: 10px;
      margin-top: 8px;
    }

    /* ── Itinerary ── */
    .itinerary {
      background: linear-gradient(160deg, #0A1628 0%, #0D2B3E 50%, #0A1E1A 100%);
      padding: 18px 20px 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .itinerary .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .itinerary .title {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .itinerary .location {
      color: #7EC8E3;
      font-size: 12px;
      font-weight: 500;
      margin-top: 5px;
    }
    .itinerary .weather {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff18;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 10px;
      font-size: 13px;
      color: #fff;
    }
    .itinerary .weather .temp {
      color: #D4A843;
      font-weight: 700;
      font-size: 15px;
      margin-left: auto;
    }
    .itinerary .weather .rain {
      color: #7EC8E3;
      font-size: 12px;
    }
    .itinerary .divider {
      width: 40px;
      height: 2px;
      background: #D4A843;
      border-radius: 1px;
      margin: 12px 0 10px;
    }
    .itinerary .description {
      color: #F5F0E8;
      font-size: 13px;
      line-height: 1.5;
      flex: 1;
    }
    .itinerary .fact-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      background: #ffffff18;
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 10px;
    }
    .itinerary .fact-star {
      color: #D4A843;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .itinerary .fact-text {
      color: #ffffff99;
      font-size: 12px;
      font-style: italic;
      line-height: 1.4;
    }

    /* ── Status ── */
    .status {
      color: #666;
      font-size: 12px;
      min-height: 20px;
    }
    .status.error { color: #e06c75; }

    /* ── Empty state ── */
    .empty {
      color: #ffffff55;
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>🇮🇹 Italia Widget Preview</h1>

  <div class="controls">
    <label for="dateInput">Preview date</label>
    <input type="date" id="dateInput" />
    <button onclick="load()">Load</button>
  </div>

  <div class="status" id="status">Loading…</div>

  <div id="widget-container"></div>

  <script>
    const EDGE_URL = "https://cxgxnqxnocwippgeduex.supabase.co/functions/v1/today";

    const CHIP_COLORS = {
      history:  "#6B3A2A",
      recipe:   "#2A4A1A",
      culture:  "#2A2A5A",
      language: "#3A2A5A",
      nature:   "#1A4A2A",
      itinerary:"#1A3A4A",
    };

    const CATEGORY_LABELS = {
      history:  "🏛  Ancient History",
      recipe:   "🍳  Recipe",
      culture:  "🎭  Culture",
      language: "💬  Italian",
      nature:   "🌿  Nature",
    };

    const CATEGORY_EMOJI = {
      history: "🏛", recipe: "🍝", culture: "🎭",
      language: "💬", nature: "🌿",
    };

    function todayRome() {
      return new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" });
    }

    // Set date input default to today
    const input = document.getElementById("dateInput");
    input.value = todayRome();
    input.addEventListener("keydown", e => { if (e.key === "Enter") load(); });

    async function load() {
      const date = input.value || todayRome();
      const status = document.getElementById("status");
      const container = document.getElementById("widget-container");

      status.className = "status";
      status.textContent = "Fetching…";
      container.innerHTML = "";

      try {
        const res = await fetch(`${EDGE_URL}?date=${date}`);
        const data = await res.json();

        if (data.error) {
          status.className = "status error";
          status.textContent = `⚠️ ${data.error}`;
          container.innerHTML = `<div class="empty">No content for this date.<br>Run seed_countdown.sql in Supabase first.</div>`;
          return;
        }

        status.textContent = `${data.type} · ${data.display_date}`;
        container.innerHTML = data.type === "itinerary"
          ? renderItinerary(data)
          : renderCountdown(data);

      } catch (e) {
        status.className = "status error";
        status.textContent = `Error: ${e.message}`;
      }
    }

    function renderCountdown(d) {
      const chip = d.category
        ? `<div class="chip" style="background:${CHIP_COLORS[d.category] ?? '#333'}">${CATEGORY_LABELS[d.category] ?? "🇮🇹 Italy"}</div>`
        : "";

      const illustration = d.illustration_url
        ? `<img src="${d.illustration_url}" alt="illustration" />`
        : (CATEGORY_EMOJI[d.category] ?? "🇮🇹");

      const dateStr = new Date().toLocaleDateString("en-GB", {
        weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Rome",
      });

      return `
        <div class="widget">
          <div class="countdown">
            <div class="header">
              <span class="flag-label">🇮🇹  ITALY</span>
              ${chip}
            </div>
            <div class="illustration">${illustration}</div>
            <div class="big-number">${d.days_until_trip ?? "?"}</div>
            <div class="days-label">days to go</div>
            <div class="fact">${d.fun_fact ?? ""}</div>
            <div class="date-label">${dateStr}</div>
          </div>
        </div>`;
    }

    function renderItinerary(d) {
      const weather = (d.weather_condition || d.weather_temp_max) ? `
        <div class="weather">
          <span>${d.weather_condition ?? ""}</span>
          <span class="temp">${d.weather_temp_max ?? "--"}°  /  ${d.weather_temp_min ?? "--"}°</span>
          ${d.weather_precip_pct > 0 ? `<span class="rain">💧 ${d.weather_precip_pct}%</span>` : ""}
        </div>` : "";

      return `
        <div class="widget">
          <div class="itinerary">
            <div class="header">
              <div class="title">${d.title ?? ""}</div>
              <span>🇮🇹</span>
            </div>
            ${d.location ? `<div class="location">📍  ${d.location}</div>` : ""}
            ${weather}
            <div class="divider"></div>
            <div class="description">${d.description ?? ""}</div>
            <div class="fact-row">
              <span class="fact-star">✦</span>
              <span class="fact-text">${d.fun_fact ?? ""}</span>
            </div>
          </div>
        </div>`;
    }

    load();
  </script>
</body>
</html>
